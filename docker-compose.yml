services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SUPPORT_READ_PASSWORD: ${SUPPORT_READ_PASSWORD}
      SUPPORT_WRITE_PASSWORD: ${SUPPORT_WRITE_PASSWORD}
      SUPPORT_CHECKPOINT_PASSWORD: ${SUPPORT_CHECKPOINT_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HEALTH_ENABLED: "true"
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET}
      ALICE_PASSWORD: ${ALICE_PASSWORD}
      BOB_PASSWORD: ${BOB_PASSWORD}
      CAROL_PASSWORD: ${CAROL_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 5s
      retries: 40

  mcp:
    build: .
    environment:
      OAUTH_JWKS_URL: http://keycloak:8080/realms/support/protocol/openid-connect/certs
      DATABASE_URL_READ: postgresql+asyncpg://support_read:${SUPPORT_READ_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_WRITE: postgresql+asyncpg://support_write:${SUPPORT_WRITE_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
