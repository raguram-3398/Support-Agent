services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SUPPORT_READ_PASSWORD: ${SUPPORT_READ_PASSWORD}
      SUPPORT_WRITE_PASSWORD: ${SUPPORT_WRITE_PASSWORD}
      SUPPORT_CHECKPOINT_PASSWORD: ${SUPPORT_CHECKPOINT_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  mcp:
    build: .
    environment:
      DATABASE_URL_READ: postgresql+asyncpg://support_read:${SUPPORT_READ_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_WRITE: postgresql+asyncpg://support_write:${SUPPORT_WRITE_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
