[project]
name = "support-agent"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "langgraph==1.2.20",
    "langchain-anthropic==1.7.10",
    "langfuse==5.2.0",
    "mcp==2.3.0",
    "uvicorn==0.54.0",
    "fastapi==0.162.2",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.9",
    "pyjwt[crypto]==2.15.1",
    "httpx2==2.16.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
    "black==26.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
